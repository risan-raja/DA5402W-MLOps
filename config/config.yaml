dataset:
  # Single HF dataset repo: raw parquet under data/, pipeline outputs under interim/ (later processed/).
  hf_repo_id: risan-raja-iitm/urbansound8K
  hf_repo_type: dataset
  local_raw_dir: data/raw
  expected_rows: 8732
  fold_range: [1, 10]
  fold_column: fold
  label_column: class
  expected_num_classes: 10
  raw_allow_patterns:
    - "data/*.parquet"
    - "UrbanSound8K.csv"
  interim_allow_patterns:
    - "interim/**"

preprocessing:
  # When false, the DAG preprocess_interim task is a no-op (reuse data/interim).
  enabled: false
  local_interim_dir: data/interim
  target_sample_rate: 16000
  eval_fold: 10
  augment_copies: 1
  fold_column: fold
  label_column: class
  seed: 42

spark:
  # When false, the DAG spark_feature_extraction task is a no-op (reuse data/processed).
  enabled: false
  local_processed_dir: data/processed
  # Keep heap small; throughput comes from batching, not a huge driver.
  driver_memory: "1g"
  max_result_size: "512m"
  master: "local[2]"
  app_name: urbansound8k-features
  num_partitions: 2
  batch_size: 512
  sample_rate: 16000
  target_duration_sec: 4.0
  n_mfcc: 13
  n_mels: 128
  n_fft: 1024
  hop_length: 512
  mel_frames: 126

versioning:
  # Same repo as dataset.hf_repo_id — do not create a second dataset repo.
  # Default push prefix for versioning CLI; Spark uses processed_path_in_repo when --push.
  path_in_repo: interim
  processed_path_in_repo: processed
  # Opt-in HF Hub uploads from the Airflow DAG / Spark extractor (also via --push CLI).
  push_interim: false
  push_processed: false
  # Separate model-type repo for trained artifacts (not the dataset repo).
  hf_model_repo_id: risan-raja-iitm/urbansound8k-models
  hf_model_repo_type: model
  push_models: true

training:
  processed_dir: data/processed
  models_dir: models
  mlflow_experiment: urbansound8K-submission
  mlflow_tracking_uri: sqlite:///mlflow/mlflow.db
  mlflow_artifact_root: ./mlflow/artifacts
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  # train_folds: [1, 2]
  val_fold: 9
  eval_fold: 10
  n_trials: 20
  # Official UrbanSound8K 10-fold eval CV (after Optuna). Off by default for fast iteration.
  cv:
    enabled: true
    n_folds: 10
  seed: 42
  models: [rf, xgboost, lightgbm, resnet18]
  cnn:
    epochs: 10
    batch_size: 32
    patience: 5
    lr: 1.0e-4

monitoring:
  drift:
    enabled: true
    window_size: 100
    reference_path: models/drift_reference.json
    psi_warn: 0.1
    psi_alert: 0.25
    n_feature_bins: 10
