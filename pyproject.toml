[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "da5402w"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.0.2,<4",
    "apache-airflow-providers-standard>=1.0.0",
    "audiomentations>=0.43.1",
    "datasets>=5.0.1",
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.28.0",
    "librosa<0.12.0",
    "lightgbm>=4.6.0",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchvision>=0.22.0",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
    "pip>=26.2.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "ruff>=0.16.4",
]

# CPU-only PyTorch on Linux/Windows (no CUDA/NVIDIA). Metal falls back to PyPI,
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Top-level package is the `src/` directory (imports are `from src....`).
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires network access and HF auth; excluded from CI",
]

